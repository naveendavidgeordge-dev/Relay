# TLS 1.3-only front door (optional compose profile "tls").
# https://localhost:8443/        -> console
# https://localhost:8443/api/... -> Relay API (prefix stripped), incl. /api/hooks/{id}
# Key exchange: X25519 today; X25519MLKEM768 (hybrid PQ) as soon as the image has OpenSSL 3.5+.
# See DESIGN/05-security-and-crypto.md for the HPKE / PQ-TLS discussion.
events {}

http {
  server_tokens off;
  upstream api { server backend:8080; }
  upstream console { server frontend:3000; }

  server {
    listen 8443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/relay.crt;
    ssl_certificate_key /etc/nginx/certs/relay.key;
    ssl_protocols TLSv1.3;
    # Add X25519MLKEM768 first once the image ships OpenSSL >= 3.5 (hybrid PQ key exchange).
    ssl_ecdh_curve X25519:prime256v1;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }

    location / {
      proxy_pass http://console;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
